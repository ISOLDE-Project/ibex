# Digilent JTAG-HS2
adapter driver ftdi
adapter speed 100
transport select jtag
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb

###
 set WORK_RAM_ADDR 0x0
 set WORK_RAM_SIZE 0x0

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x249511C3

foreach t [jtag names] {
    puts [format "TAP: %s\n" $t]
}

set _TARGETNAME $_CHIPNAME.cpu
# -------------------------------------------------------------------
# IMPORTANT:
#   core with no RAM must run without a work-area.
#   Explicitly disable work-area by setting:
#     -work-area-phys 0
#     -work-area-size 0
# -------------------------------------------------------------------
target create $_TARGETNAME riscv \
    -chain-position $_TARGETNAME \
    -work-area-phys  $WORK_RAM_ADDR \
    -work-area-size  $WORK_RAM_SIZE \
    -rtos none

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000

puts "scan_chain:\n" 
# dump jtag chain
scan_chain
puts "----\n" 
init
reset halt
halt
echo "Ready for Remote Connections"
