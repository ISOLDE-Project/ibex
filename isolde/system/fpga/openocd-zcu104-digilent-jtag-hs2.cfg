# Digilent JTAG-HS2
adapter driver ftdi
#adapter speed 750
adapter speed 6000
transport select jtag
reset_config none
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb

# -------------------------------------------------------------------
# WORK AREA: MUST STAY DISABLED ON THIS SoC
#
# A work area lets OpenOCD load and RUN the RISC-V CRC32 algorithm on
# the target (riscv_checksum_memory, 1100 bytes for RV32) to speed up
# verify_image / gdb compare-sections.
#
# With the work area disabled OpenOCD prints, once per verify:
#
#   Warn : not enough working area available(requested 1100)
#
# That warning is EXPECTED AND CORRECT - do not "fix" 
# Explanations:
# Enabling it lets OpenOCD run the RV32 CRC32
# algorithm on the target, which must be fetched from the work area AND
# load from the checksummed region. Split routers here: instr map has
# instrram but not dataram/stack; data map has dataram/stack but not
# instrram. No address satisfies both -> core stalls on the bus and
# stops answering haltreq ("unable to halt hart 0", dmstatus allrunning=1).
# -------------------------------------------------------------------
 set WORK_RAM_ADDR 0x0
 set WORK_RAM_SIZE 0x0

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x249511C3

foreach t [jtag names] {
    puts [format "TAP: %s\n" $t]
}

set _TARGETNAME $_CHIPNAME.cpu

target create $_TARGETNAME riscv \
    -chain-position $_TARGETNAME \
    -work-area-phys  $WORK_RAM_ADDR \
    -work-area-size  $WORK_RAM_SIZE \
    -rtos none

riscv set_reset_timeout_sec 200
riscv set_command_timeout_sec 200

puts "scan_chain:\n" 
# dump jtag chain
scan_chain
puts "----\n" 
init
reset halt
halt
echo "Ready for Remote Connections"
