package:
  name: lca_ibex_system
  authors:
    - daro <daro@tsr>

dependencies:
  isolde-dm:          { path: ../../vendor/isolde-dm }
  isolde-soc:         { path: ../../vendor/isolde-soc }  
  

# *                matches any target
# name             matches the target "name"
# all(T1, ..., TN) matches if all of the targets T1 to TN match (boolean AND)
# any(T1, ..., TN) matches if any of the targets T1 to TN match (boolean OR)
# not(T)           matches if target T does not match (boolean NOT)
# NOTE: every simulation testbench below must exclude the synthesis targets
# (fpga_sim / yosys / xilinx). `xilinx` was missing, so tb/tb_spm.sv ended up in
# the Vivado source list -- and it still imports the renamed `aida_lca_package`,
# which fails elaboration (and common.tcl escalates Filemgmt 20-742 to an error).
sources:
   - target: all(all(not(spm),not(any(fpga_sim,yosys,xilinx))), all(tb_dm ,redmule_hwpe ,rtl ,redmule_test_hwpe))
     files:
        - tb/tb_dm.sv
   - target: all(not(any(fpga_sim,yosys,xilinx)), all(vanilla_lca,redmule_test_hwpe, rtl, redmule_hwpe))
     files:
       - tb/tb_lca_system.sv
   - target: all (not(any(fpga_sim,yosys,xilinx)),any(spm, redmule_hwpe,redmule_complex, redmule_test_hwpe))
     files:
       - tb/tb_spm.sv
   - target: xilinx
     files:
     - fpga/rtl/xilinx_aida.sv
   - target: yosys
     files:
     - asic/ihp13/icg.sv
     - asic/rtl/rv_top.sv
     