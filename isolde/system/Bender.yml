package:
  name: lca_ibex_system
  authors:
    - daro <daro@tsr>

dependencies:
  isolde-soc:         {path: ../../vendor/isolde-soc}  
  isolde-dm:          {path: ../../vendor/isolde-dm}  

# *                matches any target
# name             matches the target "name"
# all(T1, ..., TN) matches if all of the targets T1 to TN match (boolean AND)
# any(T1, ..., TN) matches if any of the targets T1 to TN match (boolean OR)
# not(T)           matches if target T does not match (boolean NOT)
sources: 
   - target: xilinx
     files:
     - fpga/rtl/xilinx_aida.sv
   - target: yosys
     files:
     - asic/ihp13/icg.sv
     - asic/rtl/rv_top.sv


