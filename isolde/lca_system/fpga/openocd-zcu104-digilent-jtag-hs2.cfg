
# Digilent JTAG-HS2
adapter driver ftdi
adapter speed 100
transport select jtag
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb

set _CHIPNAME riscv

jtag newtap $_CHIPNAME unknown0 -irlen 5 -expected-id 0x5fffedb3
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x249511C3

foreach t [jtag names] {
    puts [format "TAP: %s\n" $t]
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

#gdb_report_data_abort enable
#gdb_report_register_access_error enable

riscv set_reset_timeout_sec 4000
riscv set_command_timeout_sec 4000

# prefer to use sba for system bus access
#riscv set_prefer_sba on -> deprected
#riscv set_mem_access progbuf 
#sysbus abstract

puts "scan_chain:\n" 
# dump jtag chain
scan_chain
puts "----\n" 
init

halt
echo "Ready for Remote Connections"
