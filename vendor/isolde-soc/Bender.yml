package:
  name: isolde-soc
  authors:
    - daro <daro@tsr>

dependencies:
  redmule:            {path: ../../vendor/redmule }
  axi:                { git: "https://github.com/pulp-platform/axi.git"               , version: 0.39.6    }
  udma_core:          {git: "https://github.com/pulp-platform/udma_core.git"          , version: 2.0.0     }
  
export_include_dirs:
#  - rtl/include
  - tb/include 

sources:
  files:   
    - rtl/common/isolde_tcdm_pkg.sv
    - rtl/aida_lca_pkg.sv
    - rtl/io/aida_io_pkg.sv
    - rtl/isolde_tcdm_if.sv
    - rtl/isolde_tcdm_to_axi.sv
    - rtl/isolde_addr_shim.sv
    - rtl/isolde_demux_tcdm.sv
    - rtl/isolde_mux_tcdm.sv   
    - rtl/isolde_hci_interconnect.sv
    - rtl/isolde_tcdm_interconnect.sv
    - rtl/isolde_log_interconnect.sv
    - rtl/isolde_boot_rom.sv
    - rtl/uart/udma_uart_tx.sv
    - rtl/uart/isolde_uart_top.sv
    - rtl/io/aida_io.sv
    - rtl/rv_top.sv
    ##level 2
    - rtl/hwe/isolde_redmule_top.sv
    - rtl/noc/isolde_router.sv
    - rtl/ibex_rst.sv
    ##level 3
    - rtl/rv_domain.sv
    - rtl/aida_top.sv

    - target: all(not(yosys),any(tb_dm,redmule_test_hwpe, redmule_complex,redmule_test_complex,fpga_sim,asic_sim))
      files:
        - tb/tb_tcdm_mem.sv
        - tb/monitor/perfCounters.sv
        - tb/monitor/isolde_hci_monitor.sv
        - tb/tb_sram_mem.sv
        - tb/tb_axi_mem.sv    
        
    - target: any(asic_sim,fpga_sim)
      files:
        - fpga/sim/tcdm_mem.sv

    - target: u_test
      files:
        - tb/tb_tcdm_mem.sv
        - tb/tb_sram_mem.sv
        - tb/tb_isolde_addr_shim.sv
        - tb/tb_isolde_mux_tcdm.sv
        - tb/tb_isolde_template.sv
        - tb/tb_isolde_log_interconnect.sv
        - tb/tb_isolde_hci_interconnect.sv
        - tb/tb_isolde_tcdm_interconnect.sv
        - tb/tb_isolde_boot_rom.sv
        - tb/isolde_uart_top_tb.sv
    - target: xilinx
      files:
        - fpga/rtl/aida_padframe.sv
        - fpga/rtl/tcdm_mem.sv
 #       - fpga/rtl/aida_top.sv
    - target: fpga_sim
      files:
        - fpga/tb/aida_tb.sv
    # - target: yosys
    #   files:
    #     - asic/rtl/aida_top.sv
    #     - asic/rtl/rv_domain_top.sv
    - target: asic_sim
      files:
        - ../../yosys/out/rv_top_yosys.v
        - ../../yosys/out/rv_top.sv
        - asic/tb/asic_tb.sv
